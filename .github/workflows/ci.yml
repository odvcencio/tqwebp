# CI for work package 0: the corpus, the correctness oracle, and the
# baseline harness. Two jobs:
#
#   - root: build, vet, gofmt, and test the root module. go test runs the
#     oracle self-tests and the baseline goldens' regeneration-check
#     (testdata/golden/jpeg_baseline.txt must match a fresh run).
#   - bench-deepteams: build, vet, and test the bench/deepteams nested
#     module on its own, proving the root module's go.mod stays clean of
#     github.com/deepteams/webp while still gating its own golden table
#     (testdata/golden/deepteams_baseline.txt).
name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  root:
    name: root module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: Offline decoder fixture generator tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_generate_decode_fixtures.py

      - name: Offline lossless fixture generator tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_generate_lossless_fixtures.py

      - name: Test (oracle self-tests + baseline golden regeneration-check)
        run: go test -count=1 ./...

      - name: Race tests
        run: go test -race -count=1 ./...

      - name: Bounded public API and reconstruction fuzz smoke tests
        env:
          GOMAXPROCS: "2"
        run: |
          go test . -run '^$' -fuzz '^FuzzEncodeAPI$' -fuzztime=10s
          go test ./internal/encoder -run '^$' -fuzz '^FuzzEncode$' -fuzztime=10s
          go test ./container -run '^$' -fuzz '^FuzzDemux$' -fuzztime=10s
          go test . -run '^$' -fuzz '^FuzzDecodeStill$' -fuzztime=10s
          go test . -run '^$' -fuzz '^FuzzLosslessContainer$' -fuzztime=10s
          go test ./internal/vp8ldecode -run '^$' -fuzz '^FuzzPayload$' -fuzztime=10s

      - name: Module graph stays pure (stdlib, golang.org/x, turboquant only)
        run: |
          extra="$(go list -m all | tail -n +2 | grep -v '^golang.org/x/' | grep -v '^m31labs.dev/turboquant ' || true)"
          if [ -n "$extra" ]; then
            echo "::error::root module depends on an unexpected module:"
            echo "$extra"
            exit 1
          fi

      - name: Root import graph permits only reviewed native decoder packages
        run: |
          bad="$(go list -deps m31labs.dev/tqwebp | grep -E 'golang.org/x/image|m31labs.dev/tqwebp/oracle' | grep -v -E '^golang.org/x/image/(vp8|vp8l)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::the root imports an unreviewed decoder or oracle dependency:"
            echo "$bad"
            exit 1
          fi
          echo "encoder dependencies outside the standard library:"
          go list -deps m31labs.dev/tqwebp | grep -E '^(m31labs.dev|golang.org|github.com)' || true

      - name: Release gates (G1 and G2 block; G2b is reported)
        run: go run ./cmd/tqbench -gates

      - name: Build for every supported target
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 js/wasm wasip1/wasm windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./... || exit 1
          done

  bench-deepteams:
    name: bench/deepteams (black-box baseline, own module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/deepteams
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/deepteams/go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: Test (deepteams golden regeneration-check)
        run: go test -count=1 ./...

  bench-corpuscompare:
    name: bench/corpuscompare (tools and rate calculation)
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: bench/corpuscompare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/corpuscompare/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and vet separate CGo tools
        run: |
          go build -o bin/encode .
          go build -tags bep -o bin/encode-bep .
          go vet ./...
          go vet -tags bep ./...
      - name: Check the rate calculation
        run: |
          python -m pip install numpy==2.3.5
          python -m unittest test_rate.py test_acceptance.py
